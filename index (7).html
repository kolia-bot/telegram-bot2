.card,.hero,.game-card,.stat,.list-item,.chart-box{border-color:#2b3241;box-shadow:0 8px 24px #0002;transition:transform .24s cubic-bezier(.2,.8,.2,1),border-color .24s,box-shadow .24s}
.card{background:linear-gradient(145deg,#1a202c,#121620);border-radius:22px;padding:18px}
.hero{background:radial-gradient(ellipse at 100% 0,#8a531c42,transparent 55%),linear-gradient(140deg,#242b39,#151923 72%);border:1px solid #58442a;border-radius:25px;padding:23px 20px;box-shadow:inset 0 1px #ffffff08,0 12px 32px #0003}
.hero:before{content:"";position:absolute;top:-80%;left:-45%;width:45%;height:260%;background:linear-gradient(90deg,transparent,#ffffff08,transparent);transform:rotate(25deg);animation:heroSweep 8s ease-in-out infinite;pointer-events:none}
.big-balance{font-size:clamp(34px,9vw,46px);line-height:1.08;text-shadow:0 0 25px #f5a62320}
.btn{min-height:48px;border-radius:15px;background:linear-gradient(180deg,#ffd47c 0%,#ffb63e 45%,#e98a1e 100%);box-shadow:0 4px 0 #975411,0 8px 18px #f39c1216,inset 0 1px #fff8;transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .2s,box-shadow .2s;position:relative;overflow:hidden}
.btn:before{content:"";position:absolute;top:0;left:-130%;height:100%;width:80%;background:linear-gradient(100deg,transparent,#ffffff50,transparent);transform:skewX(-18deg);transition:left .65s}
.btn:active{transform:translateY(2px) scale(.985);box-shadow:0 1px 0 #975411;filter:brightness(.98)}.btn:active:before{left:150%}.btn.secondary{background:linear-gradient(145deg,#292f3e,#191e29);box-shadow:0 3px 0 #090b10,inset 0 1px #ffffff0b;border-color:#353d4f}
.game-grid{gap:12px}.game-card{min-height:142px;border-radius:21px;padding:16px;background:linear-gradient(145deg,#202735,#141923);box-shadow:0 7px 22px #0002;isolation:isolate}
.game-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,#f39c1217,transparent 48%);opacity:.75;z-index:-1;transition:opacity .3s}
.game-card:after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid transparent;background:linear-gradient(130deg,#ffffff10,transparent 35%,#ffc45c13) border-box;mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);mask-composite:exclude;pointer-events:none}
.game-card:active{transform:scale(.975);border-color:#92642e;box-shadow:0 3px 12px #0004}.game-card .game-icon{width:49px;height:49px;border-radius:16px;background:linear-gradient(145deg,#3b2b19,#211b16);border:1px solid #76512466;box-shadow:inset 0 1px #ffffff0c,0 5px 12px #0002;margin-bottom:13px;color:#ffc45c}.game-card b{font-size:15px;letter-spacing:.1px}.game-card small{font-size:12px;line-height:1.4}
.section-title{font-size:18px;margin:23px 2px 12px}.tag,.chip{border-radius:12px;background:#ffffff06;border-color:#303748}.stat{background:linear-gradient(145deg,#1a202c,#121620);border-radius:17px}.field{border-radius:14px;background:#10141d;border-color:#30394a;transition:border-color .2s,box-shadow .2s}.field:focus{border-color:#e8a23c;box-shadow:0 0 0 3px #f39c1218}
.nav{background:#11151eeb;border-top:1px solid #ffffff10;box-shadow:0 -8px 28px #0003;padding-top:10px;backdrop-filter:blur(24px) saturate(1.3)}.nav button{font-size:10px;transition:color .2s,transform .2s}.nav button.active{color:#ffc45c}.nav button.active svg{filter:drop-shadow(0 0 7px #f39c1266);animation:navPop .32s ease-out}
.screen{background:radial-gradient(ellipse at 100% 0,#30211635,transparent 42%),#0b0d12;transition:transform .42s cubic-bezier(.22,.8,.22,1),visibility .42s}.screen-head{background:#11151eeb;backdrop-filter:blur(20px);border-bottom-color:#ffffff0c}.back{transition:transform .2s,background .2s}.back:active{transform:scale(.92)}
.toast{backdrop-filter:blur(18px);box-shadow:0 12px 36px #0008;border-radius:16px}.mine-cell{border-radius:13px;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .25s,box-shadow .25s}.mine-cell.safe{box-shadow:0 0 18px #2ecc7120}.playing-card{border-radius:12px;box-shadow:0 8px 20px #0004;animation:cardEnter .35s cubic-bezier(.2,.8,.2,1) both}.playing-card:nth-child(2){animation-delay:.07s}.playing-card:nth-child(3){animation-delay:.14s}.reel{box-shadow:inset 0 0 14px #0002}.slot-machine{box-shadow:0 0 30px #f39c1218,inset 0 0 0 2px #ffce72;border-width:3px}
@keyframes avatarGlow{0%,100%{box-shadow:0 0 0 4px #f7a42a16,0 6px 22px #0008}50%{box-shadow:0 0 0 6px #f7a42a0d,0 6px 28px #f39c1218}}
@keyframes heroSweep{0%,72%,100%{left:-55%;opacity:0}78%{opacity:1}94%{left:130%;opacity:0}}
@keyframes navPop{0%{transform:scale(.75)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes cardEnter{from{opacity:0;transform:translateY(9px) rotateY(-7deg)}to{opacity:1;transform:translateY(0) rotateY(0)}}
@media(hover:hover){.game-card:hover,.card:hover{transform:translateY(-2px);border-color:#4b5364;box-shadow:0 12px 30px #0003}.btn:hover{filter:brightness(1.06)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

</style>

<style>
/* Realistic fruit slot cabinet */
.slot-machine{border:5px solid #d5a64b!important;border-radius:20px!important;padding:12px!important;background:linear-gradient(135deg,#5a155f 0%,#230a36 55%,#12081f 100%)!important;box-shadow:inset 0 0 0 2px #ffe6a1,0 10px 24px #0009,0 0 22px #a34bd755!important}
.lamps{padding:5px 2px 10px}.lamp{background:#ffe7a0!important;box-shadow:0 0 7px #fff0a8,0 0 15px #ffad32!important;width:11px;height:11px}
.reels{gap:7px!important;padding:8px!important;background:#13071d!important;border:2px solid #b77a37;box-shadow:inset 0 0 14px #000b}
.reel{height:178px!important;border-radius:5px!important;background:linear-gradient(90deg,#25143d,#351b53 50%,#241238)!important;border:2px solid #e4c17b!important;box-shadow:inset 0 0 12px #0009;}
.reel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0005,transparent 12%,transparent 88%,#0005),linear-gradient(180deg,#0b0616b8,transparent 23%,transparent 77%,#0b0616b8);z-index:2}
.symbol{height:54px!important;min-height:54px!important;color:#fff!important;text-shadow:0 3px 1px #0008;}
.symbol svg{width:46px!important;height:46px!important;filter:drop-shadow(0 3px 2px #0009)}
/* Continuous smooth reel movement; each spin still settles on server result */
.reel-track{transition:transform 1.2s cubic-bezier(.12,.7,.15,1);will-change:transform}
.dice-stage{height:245px!important;perspective:1000px!important;perspective-origin:50% 45%;overflow:visible!important}
.cube{width:104px!important;height:104px!important;transform-style:preserve-3d!important;-webkit-transform-style:preserve-3d!important;transition:transform 2.2s cubic-bezier(.12,.75,.2,1)!important}
.cube .face{width:104px!important;height:104px!important;inset:0!important;border-radius:17px!important;background:linear-gradient(145deg,#fffef8 0%,#e9e5d8 55%,#c7c1b1 100%)!important;border:2px solid #a39a83!important;box-shadow:inset 0 0 0 3px #ffffffc9,inset -7px -8px 12px #89816a55,0 5px 8px #0004!important;overflow:hidden!important;backface-visibility:hidden!important;-webkit-backface-visibility:hidden!important}
.cube .face img{width:100%;height:100%;object-fit:cover;border-radius:14px;filter:drop-shadow(0 2px 1px #0002)}
.cube .face.front{transform:rotateY(0deg) translateZ(52px)!important}.cube .face.rear-face{transform:rotateY(180deg) translateZ(52px)!important}.cube .face.right{transform:rotateY(90deg) translateZ(52px)!important}.cube .face.left{transform:rotateY(-90deg) translateZ(52px)!important}.cube .face.top{transform:rotateX(90deg) translateZ(52px)!important}.cube .face.bottom{transform:rotateX(-90deg) translateZ(52px)!important}
</style>
<style id="cube3d-fix">
.win-line,.win-line.show{display:none!important}
/* Объёмный кубик: НЕТ filter/isolation/overflow на элементах с preserve-3d */
.dice-stage{height:270px!important;display:grid!important;place-items:center!important;perspective:900px!important;perspective-origin:50% 38%!important;overflow:visible!important;isolation:auto!important;position:relative}
.dice-ground{position:absolute;left:50%;top:62%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:radial-gradient(closest-side,#000a,#0000);transform:rotateX(78deg) translateZ(-40px);pointer-events:none;transition:none}
.dice-jump{position:relative;width:110px;height:110px;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.dice-tilt{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transform:rotateX(-50deg) rotateY(-28deg)}
.cube{position:absolute!important;left:0;top:0;width:110px!important;height:110px!important;transform-style:preserve-3d!important;-webkit-transform-style:preserve-3d!important;transition:none!important;filter:none!important;isolation:auto!important;will-change:transform}
.cube .face{position:absolute!important;left:0;top:0;width:110px!important;height:110px!important;inset:auto!important;border-radius:16px!important;border:1px solid #b9b19b!important;overflow:hidden!important;backface-visibility:hidden!important;-webkit-backface-visibility:hidden!important;display:block!important;background:#f4f0e3!important;box-shadow:none!important}
.cube .face:after{display:none!important}
.cube .face img{width:100%;height:100%;display:block;object-fit:cover;border-radius:0;filter:none}
.cube .face.front{transform:rotateY(0deg) translateZ(55px)!important}
.cube .face.back{transform:rotateY(180deg) translateZ(55px)!important}
.cube .face.right{transform:rotateY(90deg) translateZ(55px)!important}
.cube .face.left{transform:rotateY(-90deg) translateZ(55px)!important}
.cube .face.top{transform:rotateX(90deg) translateZ(55px)!important}
.cube .face.bottom{transform:rotateX(-90deg) translateZ(55px)!important}
.cube .core{position:absolute;left:5px;top:5px;width:100px;height:100px;border-radius:12px;background:#d9d3bf;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cube .core.front{transform:rotateY(0deg) translateZ(53px)}.cube .core.back{transform:rotateY(180deg) translateZ(53px)}.cube .core.right{transform:rotateY(90deg) translateZ(53px)}.cube .core.left{transform:rotateY(-90deg) translateZ(53px)}.cube .core.top{transform:rotateX(90deg) translateZ(53px)}.cube .core.bottom{transform:rotateX(-90deg) translateZ(53px)}
</style>
</head>

<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],tg=window.Telegram?.WebApp;
try{tg?.ready();tg?.expand();tg?.setHeaderColor?.('#12141a');tg?.setBackgroundColor?.('#12141a')}catch(e){}
const user=tg?.initDataUnsafe?.user||{},INIT=tg?.initData||'';
const API={state:'/api/state',bonus:'/api/bonus',play:'/api/play',mines:'/api/mines',bj:'/api/bj',bank:'/api/bank',exchange:'/api/exchange',top:'/api/top',profile:'/api/profile',crash:'/api/crash',plinko:'/api/plinko',hilo:'/api/hilo',market:'/api/market'};
let S={name:user.first_name||'Игрок',id:user.id||0,balance:1000,pumpkins:0,deposit:0,wins:0,losses:0,pumpkin:{price:100,stock_pct:65,event:null},tournament:{prizes:[],ends_in_sec:0,top:[]}};
let online=false,loaded=false,screenView='home',currentGame='',busy=false,lastBalance=null,historyPrices=[],exchangeTimer=null,liveTimer=null,activeMine=null,bjState=null,bankData={},topData={balances:[],wins:[]};
const money=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2}),int=n=>Math.round(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmtTime=n=>{n=Math.max(0,Math.floor(n||0));return `${Math.floor(n/3600)}ч ${Math.floor(n%3600/60)}м`};
function toast(msg,type=''){let el=document.createElement('div');el.className='toast '+type;el.textContent=msg;$('#toasts').append(el);setTimeout(()=>el.remove(),3600)}
function errText(e){return e?.message||'неизвестная ошибка'}

async function api(path,data=null,method=null){
 const m=method||(data?'POST':'GET'),url=path+(m==='GET'?'?initData='+encodeURIComponent(INIT):''),opt={method:m,headers:{'Accept':'application/json'}};
 if(m==='POST'){if(path===API.bonus){opt.headers['Content-Type']='text/plain;charset=UTF-8';opt.body=INIT}else{opt.headers['Content-Type']='application/json';opt.body=JSON.stringify({...data,initData:INIT})}}
 let r;try{r=await fetch(url,opt)}catch(e){throw Error('Сервер не ответил (network_error: '+errText(e)+')')}
 let raw;try{raw=await r.text()}catch(e){throw Error('Сервер не ответил (response_error)')}
 let j;try{j=JSON.parse(raw)}catch(e){throw Error('Сервер вернул некорректный ответ (http_'+r.status+')')}
 if(!r.ok)throw Error(j.error==='unauthorized'?'Ошибка авторизации (http_'+r.status+')':j.error==='balance'?'Недостаточно средств':j.error==='no_pumpkins'?'Недостаточно тыкв':j.error==='no_stock'?'На бирже закончились тыквы':j.error==='no_deposit'?'Недостаточно средств в банке':j.error==='already_playing'?'У тебя уже идёт игра':`Сервер не ответил (http_${r.status})`);
 if(j.error)throw Error(j.message?j.message:j.error==='balance'?'Недостаточно средств':j.error==='no_pumpkins'?'Недостаточно тыкв':j.error==='no_stock'?'На бирже закончились тыквы':j.error==='no_deposit'?'Недостаточно средств в банке':j.error==='already_playing'?'У тебя уже идёт игра':j.error==='unauthorized'?'Ошибка авторизации':'Ошибка сервера: '+j.error);
 return j;
}
function setOnline(v){online=v;$('#offline').classList.toggle('show',!v)}
function renderState(){$('#userName').textContent=user.first_name||S.name||'Игрок';$('#userId').textContent='ID: '+(user.id||S.id||'—');$('#headBalance').textContent=money(S.balance)+' TON';$('#mainBalance').innerHTML=esc(money(S.balance))+' <span>TON</span>';$('#mainPumpkins').textContent=money(S.pumpkins);$('#mainDeposit').textContent=money(S.deposit)+' TON'}

function pushPrice(p){if(!Number.isFinite(p)||p<=0)return;historyPrices.push({price:p,time:Date.now()});if(historyPrices.length>150)historyPrices.shift()}
function seedPrices(p){if(historyPrices.length)return;let now=Date.now();for(let i=60;i>=0;i--){let t=i/60,v=p*(1+(Math.random()-.5)*.08*(t+.1));historyPrices.push({price:Math.max(.01,v),time:now-i*60000})}historyPrices[historyPrices.length-1].price=p}
function drawExchangeChart(){let c=$('#exchangeChart');if(!c)return;let ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#08131a';ctx.fillRect(0,0,w,h);if(historyPrices.length<2)return;let rows=historyPrices.map((p,i)=>{let open=i?Number(historyPrices[i-1].price):Number(p.price),close=Number(p.price),wiggle=Math.max(Math.abs(close-open)*.35,Math.max(close*.001,0.0001));return {time:p.time,open,close,high:Math.max(open,close)+wiggle*(.35+(i%4)*.18),low:Math.max(0,Math.min(open,close)-wiggle*(.3+(i%3)*.16))}});let lo=Math.min(...rows.map(r=>r.low)),hi=Math.max(...rows.map(r=>r.high)),range=hi-lo||Math.max(1,hi*.02);lo=Math.max(0,lo-range*.12);hi+=range*.12;let left=66,right=w-16,top=20,bottom=h-35,pw=right-left,ph=bottom-top,n=rows.length,step=pw/n,cw=Math.max(3,Math.min(12,step*.58));const X=i=>left+(i+.5)*step,Y=v=>bottom-(v-lo)/(hi-lo)*ph;ctx.font='12px ui-monospace,Menlo,monospace';ctx.textAlign='right';ctx.textBaseline='middle';for(let i=0;i<5;i++){let y=top+i*ph/4,v=hi-i*(hi-lo)/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.strokeStyle='#19313a';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#71909a';ctx.fillText(money(v),left-9,y)}for(let i=0;i<6;i++){let x=left+i*pw/5;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.strokeStyle='#142831';ctx.stroke();let idx=Math.min(n-1,Math.round(i*(n-1)/5)),dt=new Date(rows[idx].time);ctx.textAlign=i===0?'left':i===5?'right':'center';ctx.textBaseline='top';ctx.fillStyle='#64818b';ctx.fillText(dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),x,bottom+9)}rows.forEach((r,i)=>{let x=X(i),up=r.close>=r.open,color=up?'#28d7a0':'#ff5e73';ctx.beginPath();ctx.moveTo(x,Y(r.high));ctx.lineTo(x,Y(r.low));ctx.strokeStyle=color;ctx.lineWidth=1.5;ctx.stroke();let y1=Y(r.open),y2=Y(r.close),topY=Math.min(y1,y2),bh=Math.max(2,Math.abs(y2-y1));ctx.fillStyle=color;ctx.fillRect(x-cw/2,topY,cw,bh);ctx.strokeStyle=color;ctx.strokeRect(x-cw/2,topY,cw,bh)});let last=rows[n-1],x=X(n-1),y=Y(last.close);ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.setLineDash([4,5]);ctx.strokeStyle='#d9e6e588';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillStyle=last.close>=last.open?'#28d7a0':'#ff5e73';ctx.font='bold 13px ui-monospace,Menlo,monospace';ctx.fillText(money(last.close)+' TON',left,15)}

document.addEventListener('pointerup',()=>{if(!chartHold)return;chartHold=null;chartRelease=setTimeout(()=>{let t=$('#chartTip');if(t)t.style.display='none'},800)},true);
document.addEventListener('pointercancel',()=>{chartHold=null;let t=$('#chartTip');if(t)t.style.display='none'},true);
function updateChartTip(e){let c=$('#exchangeChart'),tip=$('#chartTip');if(!c||!tip||!historyPrices.length)return;let rect=c.getBoundingClientRect(),ratio=c.width/rect.width,x=Math.max(0,Math.min(c.width,(e.clientX-rect.left)*ratio)),idx=Math.round(x/c.width*(historyPrices.length-1)),pt=historyPrices[idx];if(!pt)return;tip.textContent=money(pt.price)+' TON · '+Math.max(0,Math.round((Date.now()-pt.time)/60000))+' мин назад';tip.style.display='block';let box=c.parentElement.getBoundingClientRect();tip.style.left=Math.max(5,Math.min(box.width-155,e.clientX-box.left+8))+'px';tip.style.top=Math.max(5,e.clientY-box.top-40)+'px'}
function openBank(){navigate('bank')}
function bankHTML(){return `<div class="bank-card"><div style="font-size:11px;letter-spacing:2px">TON BANK</div><div style="font-size:13px;margin-top:24px">ТВОЙ ДЕПОЗИТ</div><div id="bankDeposit" style="font-size:34px;font-weight:850;margin-top:6px">0 TON</div><div style="font-size:11px;margin-top:13px">+1% в сутки · начисление каждые 4 часа</div><div class="bank-coin">◉</div></div><div class="card"><div class="row between"><b>Доступно</b><strong class="gold" id="bankBalance">${money(S.balance)} TON</strong></div><p class="muted">Управляй внутриигровым депозитом.</p><input id="bankAmount" class="field" type="number" min="1" step="1" value="100" placeholder="Сумма"><div class="chips">${[['100',100],['500',500],['1К',1000],['10К',10000],['МАКС',-1]].map(([l,v])=>`<button class="chip" onclick="setBankAmount(${v})">${l}</button>`).join('')}</div><div class="row"><button class="btn grow" onclick="bankAction('deposit')">Внести</button><button class="btn secondary grow" onclick="bankAction('withdraw')">Снять</button></div><div class="muted" id="bankMsg" style="margin-top:12px"></div></div>`}
function setBankAmount(n){$('#bankAmount').value=n<0?Math.max(1,Math.floor(S.balance)):n}
async function loadBank(){try{let d=await api(API.bank,{action:'info'});bankData=d;$('#bankDeposit').textContent=money(d.deposit)+' TON';$('#bankBalance').textContent=money(d.balance)+' TON'}catch(e){toast('⚠️ '+errText(e),'bad')}}
async function bankAction(action){let amount=Number($('#bankAmount')?.value);if(!Number.isInteger(amount)||amount<=0){toast('Введи целую положительную сумму','bad');return}try{let d=await api(API.bank,{action,amount});bankData=d;S.balance=d.balance??S.balance;S.deposit=d.deposit??S.deposit;renderState();$('#bankDeposit').textContent=money(d.deposit)+' TON';$('#bankBalance').textContent=money(d.balance)+' TON';$('#bankMsg').innerHTML=`<span class="green">${action==='deposit'?'Внесено':'Снято'} ${money(amount)} TON</span>`;await refreshState(false)}catch(e){toast('⚠️ '+errText(e),'bad')}}
function topsHTML(){return `<div class="tabs"><button class="tab active" data-top="balances" onclick="showTop('balances')">Балансы</button><button class="tab" data-top="wins" onclick="showTop('wins')">Выигрыши</button></div><div class="card"><table class="table"><thead><tr><th>#</th><th>Игрок</th><th id="topValueLabel">Баланс</th></tr></thead><tbody id="topRows"><tr><td colspan="3">Загрузка…</td></tr></tbody></table></div>`}
function showTop(type){$$('[data-top]').forEach(b=>b.classList.toggle('active',b.dataset.top===type));let rows=topData[type]||[];$('#topValueLabel').textContent=type==='wins'?'Выиграно':'Баланс';$('#topRows').innerHTML=rows.slice(0,20).map((x,i)=>`<tr><td>${['🥇','🥈','🥉'][i]||i+1}</td><td>${esc(x.name||'Игрок')}</td><td class="gold">${money(x.value)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Пока нет данных</td></tr>'}
async function loadTops(){try{topData=await api(API.top,{initData:INIT});showTop('balances')}catch(e){$('#topRows').innerHTML=`<tr><td colspan="3">${esc(errText(e))}</td></tr>`;toast('⚠️ '+errText(e),'bad')}}
function profileHTML(){return `<div class="card"><div class="row"><div class="avatar" style="width:56px;height:56px" id="profileAvatar">🎃</div><div class="grow"><b id="profileName">${esc(user.first_name||S.name)}</b><div class="muted" style="margin-top:5px">ID: ${esc(user.id||S.id||'—')}</div></div></div></div><div class="stat-grid"><div class="stat"><small>Баланс</small><b id="pBalance">${money(S.balance)}</b></div><div class="stat"><small>Тыквы</small><b id="pPumpkins">${money(S.pumpkins)}</b></div><div class="stat"><small>Депозит</small><b id="pDeposit">${money(S.deposit)}</b></div><div class="stat"><small>Выиграно</small><b id="pWins">${money(S.wins)}</b></div><div class="stat"><small>Проиграно</small><b id="pLosses">${money(S.losses)}</b></div><div class="stat"><small>Операций</small><b id="pOps">—</b></div></div><div class="section-title">История операций</div><div id="historyList" class="list"><div class="muted">Загрузка…</div></div>`}
async function loadProfile(){try{let d=await api(API.profile,{initData:INIT});S.balance=d.balance??S.balance;S.pumpkins=d.pumpkins??S.pumpkins;S.deposit=d.deposit??S.deposit;S.wins=d.wins??S.wins;S.losses=d.losses??S.losses;renderState();$('#pBalance').textContent=money(S.balance);$('#pPumpkins').textContent=money(S.pumpkins);$('#pDeposit').textContent=money(S.deposit);$('#pWins').textContent=money(S.wins);$('#pLosses').textContent=money(S.losses);let h=d.history||[];$('#pOps').textContent=h.length;$('#historyList').innerHTML=h.map(x=>`<div class="list-item"><div class="grow"><b>${esc(x.type||'Операция')}</b><small>${esc(x.time||'')}${x.details?' · '+esc(x.details):''}</small></div>${(()=>{const a=Math.abs(Number(x.amount)||0),out=/^\s*(Расход|Вывод|Списан|Комисс|Штраф)/i.test(x.type||'')||Number(x.amount)<0;return `<b class="${out?'red':'green'}">${out?'−':a>0?'+':''}${money(a)}</b>`})()}</div>`).join('')||'<div class="muted">История пока пуста</div>'}catch(e){$('#historyList').innerHTML=`<div class="red">${esc(errText(e))}</div>`;toast('⚠️ '+errText(e),'bad')}}
async function claimBonus(){try{let d=await api(API.bonus,null,'POST');if(d.ok){toast('Бонус: +'+money(d.reward)+' TON','good');await refreshState(false)}else toast('Бонус пока недоступен'+(d.wait_hours?' · '+d.wait_hours+' ч':''),'bad')}catch(e){toast('⚠️ '+errText(e),'bad')}}
function showBankScreen(){openScreen('Банк',bankHTML());loadBank()}
setUserAvatar();renderState();refreshState(false);liveTimer=setInterval(()=>refreshState(true),4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshState(true)});window.addEventListener('resize',()=>{if($('#rouletteCanvas')&&$('#gameScreen').classList.contains('open'))drawRoulette();if($('#exchangeChart')&&$('#screen').classList.contains('open'))drawExchangeChart()});
</script>

.hb.w{background:#143826;border-color:#2ecc71;color:#7dffb0}.hb.l{background:#2a1a1f;border-color:#6b2c35;color:#ff8d98}.hb.p{background:#222735;color:#aab2c4}
.hb.red{background:#7a1824;border-color:#e74c3c;color:#fff}.hb.black{background:#10131a;border-color:#4a5164;color:#fff}.hb.green{background:#0a5c3a;border-color:#2ecc71;color:#fff}

<script id="features-js">
(function(){
'use strict';
/* ===== хранилище (на устройстве игрока) ===== */
const KEY='ton_app_v2_'+(user.id||0);
const DEF={rounds:0,wins:0,losses:0,streak:0,bestStreak:0,wagered:0,xp:0,bestWin:0,bestMult:0,played:{},hist:{},ach:{},bonusNext:0,bonusStreak:0,lastBonus:0,sound:true,lastBet:10};
let st;try{st={...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){st={...DEF}}
st.played=st.played||{};st.hist=st.hist||{};st.ach=st.ach||{};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

/* ===== звук и вибро ===== */
let actx=null;
const A=()=>{if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx};
function tone(f,t0,d,type,v,f2){const a=A();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.07,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const SFX={
 tick(){st.sound&&tone(880,0,.04,'square',.02)},
 roll(n,span){if(!st.sound)return;n=n||12;span=span||1.6;for(let i=0;i<n;i++)tone(260+Math.random()*520,span*Math.pow(i/n,1.35),.04,'triangle',.045)},
 win(){if(!st.sound)return;[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.22,'sine',.08))},
 big(){if(!st.sound)return;[523,659,784,1047,1319,1568,2093].forEach((f,i)=>{tone(f,i*.08,.3,'triangle',.08);tone(f/2,i*.08,.3,'sine',.05)})},
 lose(){st.sound&&tone(240,0,.28,'sawtooth',.04,110)},
 ach(){if(!st.sound)return;[784,988,1175].forEach((f,i)=>tone(f,i*.11,.25,'sine',.08))}
};
const hap=(k,t)=>{try{const h=tg&&tg.HapticFeedback;if(!h)return;k==='n'?h.notificationOccurred(t):h.impactOccurred(t||'light')}catch(e){}};
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button,.chip,.game-card,.lvl-card')){SFX.tick();hap('i','light')}},true);

/* ===== уровни ===== */
const lvlOf=xp=>1+Math.floor(Math.sqrt(Math.max(0,xp)/300));
const lvlStart=l=>300*(l-1)*(l-1);
const titleOf=l=>l>=15?'Легенда':l>=10?'Хайроллер':l>=7?'Рисковый':l>=5?'Азартный':l>=3?'Игрок':'Новичок';

/* ===== достижения ===== */
const ACH=[
 {id:'w1',ic:'🥇',n:'Первая победа',d:'Выиграй любой раунд',f:s=>s.wins>=1},
 {id:'w10',ic:'🏅',n:'Десяточка',d:'10 побед',f:s=>s.wins>=10},
 {id:'w100',ic:'💯',n:'Сотня',d:'100 побед',f:s=>s.wins>=100},
 {id:'s3',ic:'🔥',n:'В ударе',d:'3 победы подряд',f:s=>s.bestStreak>=3},
 {id:'s7',ic:'⚡',n:'Неудержимый',d:'7 побед подряд',f:s=>s.bestStreak>=7},
 {id:'x5',ic:'💥',n:'Иксы!',d:'Выигрыш ×5 и больше',f:s=>s.bestMult>=5},
 {id:'x20',ic:'🚀',n:'Ракета',d:'Выигрыш ×20 и больше',f:s=>s.bestMult>=20},
 {id:'x80',ic:'👑',n:'Джекпот',d:'Выигрыш ×80 и больше',f:s=>s.bestMult>=80},
 {id:'all',ic:'🎯',n:'Универсал',d:'Сыграй во все 8 игр',f:s=>['dice','slots','roulette','mines','bj','crash','plinko','hilo'].every(g=>(s.played[g]||0)>0)},
 {id:'dice',ic:'🎲',n:'Точный глаз',d:'Угадай точное число на кубе',f:(s,c)=>c&&c.game==='dice'&&c.meta.num&&c.res==='w'},
 {id:'zero',ic:'🟢',n:'Зеро!',d:'Попади в зеро на рулетке',f:(s,c)=>c&&c.game==='roulette'&&c.meta.zero&&c.res==='w'},
 {id:'bj',ic:'🃏',n:'Блэкджек!',d:'Набери 21 с раздачи',f:(s,c)=>c&&c.game==='bj'&&c.meta.nat},
 {id:'mine',ic:'💣',n:'Сапёр',d:'Забери выигрыш в минах от ×3',f:(s,c)=>c&&c.game==='mines'&&c.res==='w'&&c.mult>=3},
 {id:'rich',ic:'💰',n:'Миллионер',d:'Баланс от 1 000 000 TON',f:()=>Number(S.balance)>=1e6},
 {id:'l5',ic:'⭐',n:'Пятый уровень',d:'Достигни 5 уровня',f:s=>lvlOf(s.xp)>=5},
 {id:'cr10',ic:'🚀',n:'Ракетчик',d:'Забери ×10 и больше в краше',f:(s,c)=>c&&c.game==='crash'&&c.res==='w'&&c.mult>=10},
 {id:'pl10',ic:'🎱',n:'В яблочко',d:'Попади шариком в ячейку ×10 и выше',f:(s,c)=>c&&c.game==='plinko'&&c.mult>=10},
 {id:'hl5',ic:'🃏',n:'Чутьё',d:'Угадай 5 карт подряд в «Выше-Ниже»',f:(s,c)=>c&&c.game==='hilo'&&c.res==='w'&&(c.meta.steps||0)>=5},
 {id:'b7',ic:'🎁',n:'Постоянный',d:'Бонус 7 дней подряд',f:s=>s.bonusStreak>=7}
];
function checkAch(c){const got=[];ACH.forEach(a=>{if(!st.ach[a.id]&&a.f(st,c)){st.ach[a.id]=Date.now();got.push(a)}});return got}

/* ===== карточка уровня на главной ===== */
function cardHTML(){const l=lvlOf(st.xp),a=lvlStart(l),b=lvlStart(l+1),p=Math.min(100,Math.round((st.xp-a)/(b-a)*100)),n=Object.keys(st.ach).length;
 return `<div class="row between"><div><div class="eyebrow">ТВОЙ УРОВЕНЬ</div><b class="lvl-name">⭐ ${l} · ${titleOf(l)}</b></div><button class="snd" id="sndBtn" aria-label="Звук">${st.sound?'🔊':'🔇'}</button></div><div class="lvl-bar"><i style="width:${p}%"></i></div><div class="row between muted" style="font-size:12px"><span>Опыт ${money(st.xp)} / ${money(b)}</span><span>🏅 ${n}/${ACH.length}</span></div><div class="lvl-tags"><span class="tag">🔥 Серия: <strong>${st.streak}</strong></span><span class="tag">🏆 Рекорд: <strong>${money(st.bestWin)}</strong></span><span class="tag">🎲 Раундов: <strong>${money(st.rounds)}</strong></span>${st.bonusStreak?`<span class="tag">🎁 Бонус: <strong>${st.bonusStreak} дн.</strong></span>`:''}</div>`}
function renderCard(){const c=document.getElementById('lvlCard');if(c)c.innerHTML=cardHTML()}
function mountCard(){const h=document.querySelector('.hero');if(!h||document.getElementById('lvlCard'))return;const c=document.createElement('div');c.className='lvl-card';c.id='lvlCard';c.innerHTML=cardHTML();c.addEventListener('click',e=>{if(e.target.closest('#sndBtn')){e.stopPropagation();st.sound=!st.sound;save();renderCard();if(st.sound)SFX.win();return}openScreen('Достижения',achHTML())});h.after(c)}
function achHTML(){const n=Object.keys(st.ach).length;return `<div class="card"><div class="row between"><b>Достижения</b><span class="gold">${n} / ${ACH.length}</span></div><div class="lvl-bar"><i style="width:${Math.round(n/ACH.length*100)}%"></i></div></div><div class="ach-grid">${ACH.map(a=>`<div class="ach ${st.ach[a.id]?'':'lock'}"><span class="ic">${st.ach[a.id]?a.ic:'🔒'}</span><b>${a.n}</b><small>${a.d}</small></div>`).join('')}</div>`}

/* ===== лента последних раундов ===== */
function stripHTML(game){const h=(st.hist[game]||[]).slice(-14);const items=h.map(x=>{if(game==='dice')return `<span class="hb ${x.r}">${x.v}</span>`;if(game==='roulette')return `<span class="hb ${x.c||'black'}">${x.v}</span>`;return `<span class="hb ${x.r}">${x.r==='w'?'×'+x.m:x.r==='p'?'=':'✕'}</span>`}).join('');return `<span class="hl">Последние</span>`+(items||'<span class="hl">пока пусто — сделай первую ставку</span>')+(st.streak>1?`<span class="hl" style="margin-left:6px">🔥 серия ${st.streak}</span>`:'')}
function renderStrip(){const e=document.getElementById('histStrip');if(e&&currentGame)e.innerHTML=stripHTML(currentGame)}

/* ===== эффекты победы ===== */
function winPop(net,mult){const d=document.createElement('div');d.className='win-pop';d.innerHTML=`<span>${mult>=10?'🔥 ОГРОМНЫЙ ВЫИГРЫШ':mult>=5?'🎉 БОЛЬШОЙ ВЫИГРЫШ':'✨ ВЫИГРЫШ'}</span><b>+${money(net)} TON</b><span>×${mult.toFixed(2).replace(/\.00$/,'')}</span>`;document.body.append(d);setTimeout(()=>d.remove(),2700)}
function confetti(n){let c=document.getElementById('confetti');if(!c){c=document.createElement('canvas');c.id='confetti';document.body.append(c)}const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);const cols=['#ffc45c','#ff6b6b','#4ecdc4','#a78bfa','#2ecc71','#ffffff'];const P=Array.from({length:n||110},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.38,vx:(Math.random()-.5)*11,vy:-Math.random()*13-4,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));const t0=performance.now();(function f(now){const t=now-t0;x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.34;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-t/2600);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore()});if(t<2600)requestAnimationFrame(f);else c.remove()})(t0)}

/* ===== учёт раунда ===== */
function record(game,bet,win,meta){bet=Number(bet)||0;win=Number(win)||0;meta=meta||{};if(bet<=0)return;
 const mult=win/bet,net=win-bet,res=net>0?'w':net===0?'p':'l',l0=lvlOf(st.xp);
 st.rounds++;st.wagered+=bet;st.xp+=bet;st.played[game]=(st.played[game]||0)+1;
 if(res==='w'){st.wins++;st.streak++;st.bestStreak=Math.max(st.bestStreak,st.streak);st.bestWin=Math.max(st.bestWin,net);st.bestMult=Math.max(st.bestMult,mult)}else if(res==='l'){st.losses++;st.streak=0}
 const hh=st.hist[game]=(st.hist[game]||[]);hh.push({r:res,m:+mult.toFixed(2).replace(/\.00$/,''),v:meta.v,c:meta.c});if(hh.length>30)hh.shift();
 const got=checkAch({game,bet,win,mult,res,meta}),l1=lvlOf(st.xp);save();renderCard();renderStrip();
 let delay=0;
 if(res==='w'){if(mult>=2)winPop(net,mult);if(mult>=5){confetti(mult>=20?220:120);SFX.big()}else SFX.win();hap('n','success');delay=700}
 else if(res==='l'){if(game!=='crash'){SFX.lose();hap('n','warning')}}
 if(l1>l0)setTimeout(()=>{toast('⭐ Новый уровень: '+l1+' · '+titleOf(l1),'good');SFX.ach();confetti(70)},delay+500);
 got.forEach((a,i)=>setTimeout(()=>{toast('🏅 Достижение: '+a.n,'good');SFX.ach();hap('n','success')},delay+900+i*1400))}

/* ===== перехват ответов сервера ===== */
const DELAY={dice:2700,roulette:4700,slots:2800,mines:0,bj:0};
let onlineShown=0,onlineRAF=0;
function onlineSet(n){n=Math.max(1,Math.round(Number(n)||0));const pill=document.getElementById('onlinePill'),el=document.getElementById('onlineNum');if(!pill||!el)return;pill.classList.add('show');if(n===onlineShown)return;const from=onlineShown||n,t0=performance.now();onlineShown=n;cancelAnimationFrame(onlineRAF);if(from!==n){pill.classList.remove('bump');void pill.offsetWidth;pill.classList.add('bump')}const step=now=>{const u=Math.min(1,(now-t0)/700),e=1-Math.pow(1-u,3);el.textContent=Math.round(from+(n-from)*e).toLocaleString('ru-RU');if(u<1)onlineRAF=requestAnimationFrame(step)};onlineRAF=requestAnimationFrame(step)}
if(typeof applyState==='function'){const _as=applyState;applyState=function(d,n){return _as(d,window.__hold>0?false:n)}}
function track(path,data,r){
 if(path===API.state&&r&&r.online!=null)onlineSet(r.online);
 if(path===API.play&&r){const g=data.game,bet=data.bet,win=Number(r.win_amount)||0;let meta={};
  if(g==='dice'){meta={v:r.value,num:/^[1-6]$/.test(String(data.choice))}}
  if(g==='roulette'){meta={v:r.result,c:r.color,zero:Number(r.result)===0}}
  setTimeout(()=>record(g,bet,win,meta),DELAY[g]||0)}
 else if(path===API.mines&&r){if(data.action==='click'){if(r.bust)record('mines',data.bet,0,{});else if(r.finished)record('mines',data.bet,r.win_amount,{});else SFX.tick()}else if(data.action==='cashout')record('mines',data.bet,r.win_amount,{})}
 else if(path===API.bj&&r){if(data.action==='hit'&&!r.bust)SFX.tick();const done=r.bust||r.outcome||r.finished;if(done&&data.action!=='start'||(data.action==='start'&&r.finished)){const win=r.bust?0:Number(r.win_amount)||0;record('bj',data.bet,win,{nat:data.action==='start'&&r.outcome==='win'})}}
 else if(path===API.hilo&&r){const b=Number(r.bet)||Number(data.bet)||0;if(r.cashed)setTimeout(()=>record('hilo',b,r.win_amount,{steps:r.steps}),800);else if(r.correct===false)setTimeout(()=>record('hilo',b,0,{}),1400)}
 else if(path===API.plinko&&r&&r.path){const b=Number(r.bet)||Number(data.bet)||0,w=Number(r.win_amount)||0,mm=Number(r.mult);setTimeout(()=>record('plinko',b,w,{v:mm}),2800)}
 else if(path===API.crash&&r){const b=Number(r.bet)||Number(data.bet)||0;if(r.cashed)record('crash',b,r.win_amount,{v:r.crash_point});else if(r.crashed)record('crash',b,0,{v:r.crash_point})}
 else if(path===API.bonus&&r){const now=Date.now();if(r.ok){st.bonusStreak=(st.lastBonus&&now-st.lastBonus<48*3600e3)?st.bonusStreak+1:1;st.lastBonus=now;st.bonusNext=now+24*3600e3;const g=checkAch(null);save();renderCard();SFX.win();confetti(60);g.forEach(a=>toast('🏅 Достижение: '+a.n,'good'))}else{st.bonusNext=now+Math.max(.5,(Number(r.wait_hours)||0)+.5)*3600e3;save()}bonusTick()}}
const _api=api;
api=async function(path,data){if(path===API.play&&data&&(data.game==='dice'||data.game==='slots'||data.game==='roulette'))SFX.roll(data.game==='roulette'?18:12,data.game==='roulette'?3.8:1.8);const r=await _api.apply(this,arguments);try{track(path,data||{},r)}catch(e){}return r};

/* ===== быстрые ставки ===== */
betInput=function(){return `<label class="muted">Ставка, TON</label><input class="field" id="bet" type="number" min="1" step="1" value="${st.lastBet||10}"><div class="chips">${[10,50,100,500].map(n=>`<button class="chip" onclick="setBet(${n})">${n}</button>`).join('')}<button class="chip" onclick="setBet('half')">½</button><button class="chip" onclick="setBet('x2')">×2</button><button class="chip" onclick="setBet('last')">↺ Прошлая</button><button class="chip" onclick="setBet('max')">MAX</button></div>`};
setBet=function(v){const e=$('#bet');if(!e)return;const mx=Math.max(1,Math.floor(S.balance)),cur=Number(e.value)||1;e.value=v==='max'?mx:v==='half'?Math.max(1,Math.floor(S.balance/2)):v==='x2'?Math.min(mx,cur*2):v==='last'?Math.min(mx,st.lastBet||10):v};
const _gb=getBet;getBet=function(){const b=_gb();if(b){st.lastBet=b;save()}return b};

/* ===== интеграция с экранами ===== */
const _open=openGame;openGame=function(id){_open(id);try{if(id==='crash'||id==='plinko')return;const gb=$('#gameBody');gb.insertAdjacentHTML('afterbegin',`<div class="hist-strip" id="histStrip">${stripHTML(id)}</div>`)}catch(e){}};
const _ph=profileHTML;profileHTML=function(){return _ph()+`<div class="section-title">Достижения <small>${Object.keys(st.ach).length}/${ACH.length}</small></div>`+achHTML().replace(/^<div class="card">[\s\S]*?<\/div><\/div>/,'')};

/* ===== таймер бонуса ===== */
function bonusTick(){const b=document.querySelector('.hero .btns .btn');if(!b||!b.lastChild)return;const left=st.bonusNext-Date.now();let t='Бонус',ready=false;if(st.bonusNext){if(left>0)t='Бонус · '+(left>3600e3?Math.ceil(left/3600e3)+' ч':Math.max(1,Math.ceil(left/60e3))+' мин');else{t='🎁 Бонус';ready=true}}b.lastChild.nodeValue=t;b.classList.toggle('ready',ready)}

window.__fx={SFX,tone,hap,A,st,confetti};
mountCard();bonusTick();try{refreshState(false)}catch(e){}setInterval(bonusTick,30000);
checkAch(null);save();renderCard();
})();
</script>
<style id="crash-css">

@keyframes cpop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes cflash{0%{opacity:.6}100%{opacity:0}}
@keyframes cshake{10%,90%{transform:translate(-1px,1px)}20%,80%{transform:translate(3px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
.btn.cash{background:linear-gradient(180deg,#6af39a,#1fa75a);box-shadow:0 4px 0 #11663a,0 0 22px #2ecc7166,inset 0 1px #fff8;color:#04210f;font-size:16px;animation:cashPulse 1.3s ease-in-out infinite}
@keyframes cashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}

</style>
<script id="crash-js">
(function(){
'use strict';
const RATE=0.09,PL=40,PR=14,PT=14,PB=24;
const C={phase:'idle',t0:0,t:0,tEnd:0,bet:0,auto:0,m:1,cp:1,cashM:1,raf:0,pollT:0,polling:false,cashing:false,busy:false,fails:0,W:300,H:280,d:1,vt:10,vy:2.2,parts:[],stars:[],ring:null,fly:0,last:0,lastInt:1,eng:null,hist:[],tipX:0,tipY:0,ang:-.6,btn:'',txt:'',col:'',autoPoll:0,starOff:0};
const FX=()=>window.__fx||{SFX:{tick(){},win(){},big(){}},hap(){},tone(){},A(){return null},st:{sound:false}};
const hue=m=>C.phase==='crashed'?352:Math.max(4,200-Math.log2(Math.max(1,m))*38);

window.crashHTML=function(){return `<div class="card crash-card"><div class="hist-strip" id="crashHist"></div><div class="crash-stage" id="crashStage"><canvas id="crashCanvas"></canvas><div class="crash-flash" id="crashFlash"></div><div class="crash-mult" id="crashMult">1.00×</div><div class="crash-sub" id="crashSub">Сделай ставку и лови иксы</div></div>${betInput()}<label class="muted">Авто-вывод, ×</label><input class="field" id="crashAuto" type="number" step="0.1" min="1.01" placeholder="выключен"><div class="chips">${['1.5','2','3','5','10'].map(x=>`<button class="chip" onclick="document.getElementById('crashAuto').value='${x}'">×${x}</button>`).join('')}<button class="chip" onclick="document.getElementById('crashAuto').value=''">Выкл</button></div><button class="btn" id="crashBtn" style="width:100%;margin-top:6px" onclick="crashAction()">🚀 Запустить</button><div class="muted" style="margin-top:12px;font-size:12px;line-height:1.5">Множитель растёт каждую секунду. Забери выигрыш до краша, иначе ставка сгорит. Автовывод сработает сам, даже если ты свернёшь приложение.</div></div>`};

/* ---------- история иксов ---------- */
function setHist(a){if(!Array.isArray(a))return;C.hist=a.map(Number).filter(Number.isFinite).slice(-30);renderHist(false)}
function renderHist(isNew){const e=document.getElementById('crashHist');if(!e)return;const l=C.hist.slice(-14).reverse();e.innerHTML='<span class="hl">Последние иксы</span>'+(l.map((x,i)=>`<span class="hb ${x<2?'l':x<10?'w':'g'}"${i===0&&isNew?' style="animation:hbIn .55s cubic-bezier(.2,.8,.2,1.3)"':''}>${x.toFixed(2)}×</span>`).join('')||'<span class="hl">пока пусто</span>')}
function pushHist(r,cp){if(r&&Array.isArray(r.history)){const had=C.hist.length;C.hist=r.history.map(Number).filter(Number.isFinite).slice(-30);renderHist(true)}else if(Number.isFinite(cp)){C.hist.push(cp);renderHist(true)}}

/* ---------- холст ---------- */
function fit(){const cv=document.getElementById('crashCanvas');if(!cv)return false;const r=cv.getBoundingClientRect();if(!r.width)return false;const d=Math.min(2,window.devicePixelRatio||1),w=Math.round(r.width*d),h=Math.round(r.height*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}C.d=d;C.W=r.width;C.H=r.height;return true}
window.addEventListener('resize',()=>{if(document.getElementById('crashCanvas'))fit()});
const px=t=>PL+t/C.vt*(C.W-PL-PR),py=m=>C.H-PB-(m-1)/(C.vy-1)*(C.H-PB-PT);
const mAt=t=>Math.exp(RATE*t);

function rocket(ctx,x,y,ang,flick,s,alpha){ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);ctx.rotate(ang);ctx.scale(s,s);
 const fl=12+flick*16,g=ctx.createLinearGradient(-12,0,-12-fl,0);g.addColorStop(0,'#fff6c2');g.addColorStop(.35,'#ffb63e');g.addColorStop(1,'rgba(255,80,40,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-11,-4.5);ctx.quadraticCurveTo(-12-fl*.7,-3,-12-fl,0);ctx.quadraticCurveTo(-12-fl*.7,3,-11,4.5);ctx.closePath();ctx.fill();
 ctx.fillStyle='#ff5d6c';ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(-18,-13);ctx.lineTo(-3,-7);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-10,5);ctx.lineTo(-18,13);ctx.lineTo(-3,7);ctx.closePath();ctx.fill();
 const bg=ctx.createLinearGradient(0,-8,0,8);bg.addColorStop(0,'#fff');bg.addColorStop(1,'#aab5cd');ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(21,0);ctx.bezierCurveTo(13,-9.5,-2,-8.5,-12,-5.5);ctx.lineTo(-12,5.5);ctx.bezierCurveTo(-2,8.5,13,9.5,21,0);ctx.closePath();ctx.fill();
 ctx.fillStyle='#ff5d6c';ctx.beginPath();ctx.moveTo(21,0);ctx.bezierCurveTo(17,-4.5,13,-7,9,-7.6);ctx.lineTo(9,7.6);ctx.bezierCurveTo(13,7,17,4.5,21,0);ctx.closePath();ctx.fill();
 ctx.fillStyle='#4ecdc4';ctx.strokeStyle='#24425a';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(-1,0,3.7,0,7);ctx.fill();ctx.stroke();ctx.restore()}

function niceStep(range,max){const c=[.25,.5,1,2,5,10,25,50,100,250,500,1000];for(const s of c)if(range/s<=max)return s;return 1000}

function update(dt,now){
 if(C.phase==='run'){C.t=(performance.now()-C.t0)/1000;C.m=Math.min(1000,mAt(C.t))}
 else if(C.phase==='crashed'||C.phase==='cashed'){C.t=C.tEnd}
 else{C.t=0;C.m=1}
 const k=1-Math.exp(-dt*4.5),tt=Math.max(10,C.t/.82),vm=Math.max(2.2,1+(C.m-1)/.8);C.vt+=(tt-C.vt)*k;C.vy+=(vm-C.vy)*k;
 C.starOff+=dt*(C.phase==='run'?12+Math.min(60,C.m*2.5):5);
 if(C.phase==='run'){
  if(C.auto&&C.m>=C.auto&&now-C.autoPoll>180){C.autoPoll=now;poll()}
  const fi=Math.floor(C.m);if(fi>C.lastInt&&fi<=50){C.lastInt=fi;const f=FX();f.hap('i','light');const e=document.getElementById('crashMult');if(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}}
  if(C.eng&&FX().st.sound){try{C.eng.o.frequency.setTargetAtTime(150+Math.log2(C.m)*75,C.eng.a.currentTime,.08)}catch(e){}}
  for(let i=0;i<2;i++)C.parts.push({x:C.tipX-Math.cos(C.ang)*16+(Math.random()-.5)*4,y:C.tipY-Math.sin(C.ang)*16+(Math.random()-.5)*4,vx:-Math.cos(C.ang)*(40+Math.random()*60)+(Math.random()-.5)*30,vy:-Math.sin(C.ang)*(40+Math.random()*60)+(Math.random()-.5)*30,life:.7+Math.random()*.5,max:1.2,r:2+Math.random()*3,kind:'smoke'})
 }
 if(C.phase==='cashed'&&C.fly<1)C.fly=Math.min(1,C.fly+dt/.9);
 for(const p of C.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind==='boom')p.vy+=260*dt;p.vx*=.992;p.life-=dt}
 C.parts=C.parts.filter(p=>p.life>0);if(C.parts.length>260)C.parts.splice(0,C.parts.length-260);
 if(C.ring){C.ring.r+=dt*430;C.ring.a-=dt*1.7;if(C.ring.a<=0)C.ring=null}
 /* текст множителя и кнопка */
 const shown=C.phase==='crashed'?C.cp:C.phase==='cashed'?C.cashM:Math.floor(C.m*100)/100,txt=shown.toFixed(2)+'×',col=C.phase==='crashed'?'#ff5d6c':C.phase==='idle'?'#ffffff':`hsl(${hue(C.m)},90%,68%)`;
 const me=document.getElementById('crashMult');if(me){if(txt!==C.txt){me.textContent=txt;C.txt=txt}if(col!==C.col){me.style.color=col;C.col=col}}
 if(C.phase==='run'){const b=document.getElementById('crashBtn');const t='💰 Забрать '+money(Math.floor(C.bet*Math.floor(C.m*100)/100))+' TON';if(b&&t!==C.btn){b.textContent=t;C.btn=t}}
}

function draw(ctx,now){
 const W=C.W,H=C.H,d=C.d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);
 const hu=hue(C.phase==='crashed'?C.cp:C.m);
 /* свечение */
 const gl=ctx.createRadialGradient(PL,H-PB,10,PL,H-PB,W*.95);gl.addColorStop(0,`hsla(${hu},85%,50%,.26)`);gl.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
 /* звёзды */
 if(!C.stars.length)for(let i=0;i<55;i++)C.stars.push({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.2,tw:Math.random()*6,z:.3+Math.random()*.9});
 ctx.fillStyle='#fff';for(const s of C.stars){const x=((s.x*W-C.starOff*s.z)%W+W)%W;ctx.globalAlpha=.25+.45*Math.abs(Math.sin(now/700+s.tw));ctx.beginPath();ctx.arc(x,s.y*(H-PB),s.r,0,7);ctx.fill()}ctx.globalAlpha=1;
 /* сетка */
 ctx.font='10px ui-monospace,Menlo,monospace';ctx.textBaseline='middle';ctx.textAlign='right';
 const st=niceStep(C.vy-1,5);ctx.lineWidth=1;
 for(let v=Math.max(1,Math.ceil(1/st)*st);v<=C.vy;v+=st){const y=py(v);ctx.strokeStyle='rgba(255,255,255,.07)';ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.38)';ctx.fillText((+v.toFixed(2))+'×',PL-6,y)}
 ctx.textAlign='center';ctx.textBaseline='top';const ts=[1,2,5,10,15,30,60,120].find(s=>C.vt/s<=5)||120;
 for(let v=0;v<=C.vt;v+=ts){const x=px(v);ctx.strokeStyle='rgba(255,255,255,.05)';ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,H-PB);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillText(v+'с',x,H-PB+6)}
 ctx.strokeStyle='rgba(255,255,255,.22)';ctx.beginPath();ctx.moveTo(PL,H-PB);ctx.lineTo(W-PR,H-PB);ctx.stroke();
 /* линия автовывода */
 if(C.auto>1&&C.auto<=C.vy&&(C.phase==='run'||C.phase==='cashed')){const y=py(C.auto);ctx.setLineDash([5,5]);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();ctx.setLineDash([]);ctx.textAlign='right';ctx.textBaseline='bottom';ctx.fillStyle='rgba(255,255,255,.6)';ctx.fillText('авто ×'+C.auto,W-PR-2,y-2)}
 /* кривая */
 const t=C.t;let ang=C.ang,tx=PL+26,ty=H-PB-16;
 if(C.phase==='idle'){ty+=Math.sin(now/650)*3;ang=-.62+Math.sin(now/900)*.04}
 else if(t>0){
  const n=Math.max(3,Math.min(130,Math.floor(t*16)+3));ctx.beginPath();

 for(const p of C.parts){const a=Math.max(0,p.life/(p.max||1));if(p.kind==='boom'){ctx.fillStyle=`hsla(${20+Math.random()*30},100%,${55+a*20}%,${a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.6+a*.6),0,7);ctx.fill()}else{ctx.fillStyle=`hsla(${hu},90%,70%,${a*.28})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1.6-a*.7),0,7);ctx.fill()}}

function loop(now){const cv=document.getElementById('crashCanvas');if(!cv){C.raf=0;return}

function startLoop(){if(!C.raf){C.last=0;C.raf=requestAnimationFrame(loop)}}

/* ---------- звук двигателя ---------- */
function engineOn(){const f=FX();if(!f.st.sound||C.eng)return;try{const a=f.A();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=150;g.gain.value=.0001;g.gain.exponentialRampToValueAtTime(.022,a.currentTime+.4);o.connect(g);g.connect(a.destination);o.start();C.eng={o,g,a}}catch(e){}}

function setSub(t){const e=document.getElementById('crashSub');if(e)e.innerHTML=t}
function btnIdle(){const b=document.getElementById('crashBtn');if(b){b.classList.remove('cash');b.textContent='🚀 Запустить';b.disabled=false;C.btn=''}}
function stopPoll(){clearInterval(C.pollT);C.pollT=0;C.polling=false}
function begin(t0){C.phase='run';C.t0=t0;C.m=1;C.t=0;C.fails=0;C.parts=[];C.ring=null;C.fly=0;C.lastInt=1;C.vt=10;C.vy=2.2;C.txt='';lock(true);const b=document.getElementById('crashBtn');if(b){b.classList.add('cash');b.disabled=false}setSub('Забери выигрыш до краша!');engineOn();stopPoll();C.pollT=setInterval(poll,280);startLoop()}

 boom();FX().hap('n','error');endCommon();setSub(`💥 Улетел на <b>×${C.cp.toFixed(2)}</b> · <span style="color:#ff8d98">−${money(C.bet)} TON</span>`);pushHist(r,C.cp);refreshState(false)}

function onCashed(r){if(C.phase!=='run')return;C.cashM=Number(r.mult)||1;C.cp=Number(r.crash_point)||0;C.phase='cashed';C.tEnd=Math.log(Math.max(1.0001,C.cashM))/RATE;C.t=C.tEnd;C.m=C.cashM;C.fly=0;

async function poll(){if(C.phase!=='run'||C.polling)return;C.polling=true;

 finally{C.polling=false}}

async function startRound(){if(C.busy||C.phase==='run')return;const bet=getBet();if(!bet)return;
 const raw=document.getElementById('crashAuto')?.value,auto=raw?parseFloat(raw):0;if(raw&&(!(auto>=1.01)||auto>1000)){toast('Авто-вывод: от ×1.01 до ×1000','bad');return}

 try{const t1=performance.now(),r=await api(API.crash,{action:'start',bet,auto:auto||0}),rtt=performance.now()-t1;
  C.bet=bet;C.auto=auto||0;if(r.history)setHist(r.history);begin(performance.now()-rtt/2);if(r.balance!=null){S.balance=r.balance;renderState()}refreshState(false);FX().SFX.tick()}

 finally{C.busy=false}}

async function cashOut(){if(C.cashing||C.phase!=='run')return;C.cashing=true;const b=document.getElementById('crashBtn');if(b)b.disabled=true;

  if(r.crashed||r.cashed){toast(r.cashed?`🤖 Автовывод ×${Number(r.mult).toFixed(2)} · +${money(r.win_amount)} TON`:`💥 Пока тебя не было раунд улетел на ×${Number(r.crash_point).toFixed(2)}`,r.cashed?'good':'bad');refreshState(false)}
  else if(r.active){C.bet=r.bet;C.auto=r.auto||0;const a=document.getElementById('crashAuto');if(a&&C.auto)a.value=C.auto;const be=document.getElementById('bet');if(be)be.value=r.bet;begin(performance.now()-r.elapsed*1000)}
 }catch(e){}})()};

window.crashStop=function(){if(C.raf){cancelAnimationFrame(C.raf);C.raf=0}stopPoll();engineOff();if(C.phase==='run'){toast('🚀 Раунд продолжается — вернись в «Краш», чтобы забрать выигрыш');C.phase='idle'}};
})();
</script>

const NAMES={low:'Низкий',medium:'Средний',high:'Высокий'};
const P={risk:'medium',tables:{low:mk(BASE.low),medium:mk(BASE.medium),high:mk(BASE.high)},balls:[],raf:0,last:0,W:340,H:420,d:1,flash:{},slotF:[],floats:[],ripples:[],hist:[],auto:false,autoT:0,busy:false,tblT:0,hold:0,geo:null};

const hexOf=m=>m>=50?'#ff3b5c':m>=10?'#ff6b3d':m>=4?'#ffb02e':m>=1.5?'#ffd84a':m>=1?'#6ee7a0':'#5b7bd5';

/* ---------- разметка ---------- */
window.plinkoHTML=function(){return `<div class="card plinko-card"><div class="hist-strip" id="plinkoHist"></div><div class="plinko-stage"><canvas id="plinkoCanvas"></canvas></div><div class="risk-row">${['low','medium','high'].map(r=>`<button class="chip ${r===P.risk?'on':''}" data-risk="${r}" onclick="plinkoRisk('${r}')">${NAMES[r]}</button>`).join('')}</div>${betInput()}<div class="row" style="gap:10px;margin-top:6px"><button class="btn grow" id="plinkoBtn" onclick="plinkoDrop()">🎱 Бросить шар</button><button class="btn secondary" id="plinkoAuto" onclick="plinkoToggleAuto()" style="min-width:96px">Авто</button></div><div class="plinko-res muted" id="plinkoRes">Выбери риск и бросай шар — каждый отскок решает судьбу ставки</div></div>`};

function renderHist(isNew){const e=document.getElementById('plinkoHist');if(!e)return;const l=P.hist.slice(-14).reverse();e.innerHTML='<span class="hl">Последние иксы</span>'+(l.map((x,i)=>`<span class="hb ${x<1?'l':x<4?'w':'g'}"${i===0&&isNew?' style="animation:hbIn .55s cubic-bezier(.2,.8,.2,1.3)"':''}>${x.toFixed(2)}×</span>`).join('')||'<span class="hl">пока пусто</span>')}

/* ---------- геометрия ---------- */
function fit(){const cv=document.getElementById('plinkoCanvas');if(!cv)return false;const r=cv.getBoundingClientRect();if(!r.width)return false;const d=Math.min(2,devicePixelRatio||1),w=Math.round(r.width*d),h=Math.round(r.height*d);if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}P.d=d;P.W=r.width;P.H=r.height;
 const mg=12,dx=(P.W-mg*2)/(ROWS+1),pegTop=58,slotH=30,avail=P.H-pegTop-slotH-26,dy=Math.min(dx*1.18,avail/(ROWS-1));P.geo={dx,dy,pegTop,cx:P.W/2,slotY:pegTop+(ROWS-1)*dy+dy*.85,slotH,pegR:Math.max(2.4,dx*.11),ballR:Math.max(5,dx*.27)};return true}
const pegX=(j,m)=>P.geo.cx+(m-j/2)*P.geo.dx,pegY=j=>P.geo.pegTop+j*P.geo.dy,slotX=k=>P.geo.cx+(k-ROWS/2)*P.geo.dx;
window.addEventListener('resize',()=>{if(document.getElementById('plinkoCanvas'))fit()});

/* ---------- траектория ---------- */
const D0=.27,DS=.175,DL=.34;
function mkBall(r){const ks=[0];for(let j=0;j<ROWS;j++)ks.push(ks[j]+r.path[j]);const T=[D0];for(let j=1;j<ROWS;j++)T.push(T[j-1]+DS);return{r,ks,T,t0:performance.now(),hit:0,trail:[],done:false,total:T[ROWS-1]+DL,landed:false,fade:0,x:0,y:0}}
function ballPos(b,el){const g=P.geo,R=g.ballR+g.pegR,cy=j=>pegY(j)-R;
 const cp=j=>({x:pegX(j,b.ks[j]),y:cy(j)});
 if(el<b.T[0]){const u=el/D0,s=cp(0);return{x:s.x,y:(s.y-52)+(52)*u*u}}
 for(let j=1;j<ROWS;j++){if(el<b.T[j]){const a=cp(j-1),c=cp(j),u=(el-b.T[j-1])/DS,hop=g.dy*.55;return{x:a.x+(c.x-a.x)*(u*u*(3-2*u)*.6+u*.4),y:a.y+(c.y-a.y)*u-hop*4*u*(1-u)}}}
 const a=cp(ROWS-1),fx=slotX(b.ks[ROWS]),fy=g.slotY+g.slotH*.55,u=Math.min(1,(el-b.T[ROWS-1])/DL),e=u<1?(1-Math.pow(1-u,3)):1;
 return{x:a.x+(fx-a.x)*(u*u*(3-2*u)),y:a.y+(fy-a.y)*e-(Math.sin(u*Math.PI)*g.dy*.45)}}

function tick(row){const f=FX();if(!f.st.sound)return;f.tone(420+row*38,0,.05,'triangle',.028)}

/* ---------- кадр ---------- */
function frame(now){const cv=document.getElementById('plinkoCanvas');if(!cv){P.raf=0;return}if(!P.geo||P.W<10)fit();const dt=Math.min(.05,(now-(P.last||now))/1000);P.last=now;
 const ctx=cv.getContext('2d'),g=P.geo,W=P.W,H=P.H,d=P.d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);
 /* шары */
 for(const b of P.balls){const el=(now-b.t0)/1000;if(!b.landed){const pos=ballPos(b,Math.min(el,b.total));b.x=pos.x;b.y=pos.y;b.trail.push({x:b.x,y:b.y});if(b.trail.length>11)b.trail.shift();
   while(b.hit<ROWS&&el>=b.T[b.hit]){const j=b.hit,key=j+','+b.ks[j];P.flash[key]=now;P.ripples.push({x:pegX(j,b.ks[j]),y:pegY(j),t:now});tick(j);b.hit++}
   if(el>=b.total){b.landed=true;b.landAt=now;land(b)}}
  else{b.fade=Math.min(1,(now-b.landAt)/500)}}
 P.balls=P.balls.filter(b=>!(b.landed&&b.fade>=1));
 /* слоты */
 const tbl=P.tables[P.risk],ta=Math.min(1,(now-P.tblT)/320);
 for(let k=0;k<=ROWS;k++){const m=tbl[k],c=hexOf(m),w=g.dx-3,x=slotX(k)-w/2,fl=Math.max(0,1-(now-(P.slotF[k]||0))/650),dy=fl>0?Math.sin(fl*Math.PI)*5:0,y=g.slotY+dy*.0+ (fl>0?Math.sin((1-fl)*Math.PI)*5:0);
  ctx.save();ctx.globalAlpha=.55+.45*ta;const gr=ctx.createLinearGradient(0,y,0,y+g.slotH);gr.addColorStop(0,c+'cc');gr.addColorStop(1,c+'44');ctx.fillStyle=gr;if(fl>0){ctx.shadowColor=c;ctx.shadowBlur=18*fl}rr(ctx,x,y,w,g.slotH,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle=c+(fl>0?'ff':'88');ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=ta;ctx.fillStyle='#fff';ctx.font=`bold ${w<22?9.5:10.5}px ui-monospace,Menlo,monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(m>=10?String(Math.round(m)):m>=1?m.toFixed(1):m.toFixed(2).replace('0.','.'),x+w/2,y+g.slotH/2+.5);ctx.restore()}
 /* колышки */
 for(let j=0;j<ROWS;j++)for(let m=0;m<=j;m++){const x=pegX(j,m),y=pegY(j),f=Math.max(0,1-(now-(P.flash[j+','+m]||0))/420);ctx.beginPath();ctx.arc(x,y,g.pegR*(1+f*.9),0,7);ctx.fillStyle=f>0?`rgba(255,${220-f*20|0},${140+f*60|0},${.55+f*.45})`:'rgba(205,215,245,.62)';if(f>0){ctx.shadowColor='#ffd47c';ctx.shadowBlur=14*f}ctx.fill();ctx.shadowBlur=0}
 /* круги от ударов */
 P.ripples=P.ripples.filter(r=>now-r.t<520);for(const r of P.ripples){const u=(now-r.t)/520;ctx.beginPath();ctx.arc(r.x,r.y,g.pegR+u*g.dx*.55,0,7);ctx.strokeStyle=`rgba(255,220,150,${.4*(1-u)})`;ctx.lineWidth=1.5;ctx.stroke()}
 /* шарики */
 for(const b of P.balls){const al=1-b.fade,rad=g.ballR*(1-b.fade*.4);
  b.trail.forEach((p,i)=>{const a=i/b.trail.length;ctx.beginPath();ctx.arc(p.x,p.y,rad*(.3+.6*a),0,7);ctx.fillStyle=`rgba(255,190,80,${.22*a*al})`;ctx.fill()});
  const gr=ctx.createRadialGradient(b.x-rad*.35,b.y-rad*.4,rad*.15,b.x,b.y,rad);gr.addColorStop(0,'#fff6c8');gr.addColorStop(.45,'#ffc83a');gr.addColorStop(1,'#e07a10');ctx.globalAlpha=al;ctx.shadowColor='#ffb02e';ctx.shadowBlur=16;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(b.x,b.y,rad,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1}
 /* всплывающие подписи */
 P.floats=P.floats.filter(f=>now-f.t<1500);for(const f of P.floats){const u=(now-f.t)/1500,y=f.y-u*38,a=u<.15?u/.15:1-Math.max(0,(u-.55)/.45);ctx.globalAlpha=Math.max(0,a);ctx.font='800 15px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#0a0d18';ctx.strokeText(f.txt,f.x,y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,y);ctx.globalAlpha=1}
 P.raf=requestAnimationFrame(frame)}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function startLoop(){if(!P.raf){P.last=0;P.raf=requestAnimationFrame(frame)}}

/* ---------- приземление ---------- */
function land(b){const r=b.r,k=b.ks[ROWS],m=Number(r.mult),f=FX(),col=hexOf(m);P.slotF[k]=performance.now();
 P.floats.push({x:slotX(k),y:P.geo.slotY-10,txt:'×'+m.toFixed(2),col});
 P.hist.push(m);if(P.hist.length>30)P.hist.shift();renderHist(true);
 const win=Number(r.win_amount)||0,bet=Number(r.bet)||0,res=document.getElementById('plinkoRes');
 if(res)res.innerHTML=`<b style="color:${col}">×${m.toFixed(2)}</b> · ${win>bet?`<span class="green">+${money(win-bet)} TON</span>`:win===bet?'ставка возвращена':`<span class="red">−${money(bet-win)} TON</span>`}`;
 if(f.st.sound){f.tone(m>=1?660:260,0,.12,'sine',.06);if(m>=4){f.tone(990,.08,.18,'sine',.06);f.tone(1320,.16,.22,'sine',.05)}}f.hap('i',m>=4?'medium':'light');
 P.hold=Math.max(0,P.hold-1);window.__hold=P.hold;if(r.balance!=null){S.balance=r.balance;renderState()}refreshState(false)}

/* ---------- действия ---------- */
window.plinkoRisk=function(r){if(r===P.risk)return;P.risk=r;P.tblT=performance.now();document.querySelectorAll('[data-risk]').forEach(b=>b.classList.toggle('on',b.dataset.risk===r))};
window.plinkoDrop=async function(){if(P.busy||P.balls.filter(b=>!b.landed).length>=9)return;const bet=getBet();if(!bet)return;P.busy=true;
 try{const r=await api(API.plinko,{action:'drop',bet,risk:P.risk});if(!document.getElementById('plinkoCanvas'))return;if(!P.geo)fit();
  P.hold++;window.__hold=P.hold;S.balance=Number(r.balance)-Number(r.win_amount);renderState();
  P.balls.push(mkBall(r));startLoop()}
 catch(e){const m=errText(e);toast('⚠️ '+(/http_404|http_405|некорректн|unknown/.test(m)?'Плинко ещё не включено на сервере — обнови бота':m),'bad');if(P.auto)window.plinkoToggleAuto()}
 finally{P.busy=false}};
window.plinkoToggleAuto=function(){P.auto=!P.auto;clearInterval(P.autoT);const b=document.getElementById('plinkoAuto');if(b){b.classList.toggle('auto-on',P.auto);b.textContent=P.auto?'Стоп':'Авто'}if(P.auto){plinkoDrop();P.autoT=setInterval(()=>{if(!document.getElementById('plinkoCanvas'))return window.plinkoToggleAuto();plinkoDrop()},950)}};

window.plinkoInit=function(){P.balls=[];P.flash={};P.slotF=[];P.floats=[];P.ripples=[];P.busy=false;P.auto=false;clearInterval(P.autoT);P.geo=null;P.tblT=performance.now()-1000;P.hold=0;window.__hold=0;
 setTimeout(fit,30);fit();renderHist(false);startLoop();
 (async()=>{try{const c=await api(API.plinko,{action:'config'});if(c&&c.tables&&c.tables.medium&&c.tables.medium.length===ROWS+1){P.tables=c.tables}}catch(e){}})()};
window.plinkoStop=function(){if(P.raf){cancelAnimationFrame(P.raf);P.raf=0}clearInterval(P.autoT);P.auto=false;P.hold=0;window.__hold=0};
})();
</script>

<script id="hilo-js">
(function(){
'use strict';
const H={active:false,busy:false,el:null,idleCard:false,card:null,mult:1,steps:0,up:null,down:null,bet:0,shownMult:1,multRAF:0};
const RED={'♥':1,'♦':1},RK=r=>r===14?'A':r===13?'K':r===12?'Q':r===11?'J':String(r);
const FX=()=>window.__fx||{tone(){},hap(){},st:{sound:false}};
const $$h=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fin=a=>a.finished.catch(()=>{});

function face(c){const col=RED[c.suit]?'#d6283f':'#1b2133',rk=RK(c.rank);return `<div class="hl-corner" style="color:${col}"><b>${rk}</b><i>${c.suit}</i></div><div class="hl-pip" style="color:${col}">${c.suit}</div><div class="hl-corner br" style="color:${col}"><b>${rk}</b><i>${c.suit}</i></div>`}
function mk(c,up){const el=document.createElement('div');el.className='hl-card';el.innerHTML=`<div class="hl-inner"><div class="hl-face hl-back"></div><div class="hl-face hl-front">${c?face(c):''}</div></div>`;if(up)el.firstChild.style.transform='rotateY(180deg)';return el}
const stage=()=>$$h('hiloStage');
const center=el=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}};

/* ---------- разметка ---------- */
window.hiloHTML=function(){return `<div class="card hilo-card" id="hiloCard"><div class="hilo-stage" id="hiloStage"><div class="hl-deck" id="hlDeck"><i></i><i></i><i></i><i></i></div><div class="hl-info"><b id="hlMult">×1.00</b><small id="hlWin">Сделай ставку</small></div><div class="hl-msg" id="hlMsg">Выше или ниже? Угадывай и множь ставку</div><div class="hl-trail" id="hlTrail"></div><div class="hl-flash" id="hlFlash"></div></div><div class="hl-actions hl-play"><button class="up" id="hlUp" onclick="hiloGuess('up')">▲ Выше<small id="hlUpX">—</small></button><button class="down" id="hlDown" onclick="hiloGuess('down')">▼ Ниже<small id="hlDownX">—</small></button></div><div class="hl-row2 hl-play"><button class="btn secondary" id="hlSkip" onclick="hiloSkip()">🔄 Другая карта</button><button class="btn cash" id="hlCash" onclick="hiloCash()">💰 Забрать</button></div><div class="hl-idle">${betInput()}<button class="btn" id="hlStart" style="width:100%;margin:10px 0 0" onclick="hiloStart()">🃏 Раздать карту</button><div class="muted" style="margin-top:12px;font-size:12px;line-height:1.5">Угадай, будет ли следующая карта выше или ниже. Чем меньше шансов — тем больше множитель. Ничья проигрывает. Забрать выигрыш можно после первой угаданной карты.</div></div></div>`};

/* ---------- утилиты UI ---------- */
function setMode(play){const c=$$h('hiloCard');if(c)c.classList.toggle('playing',!!play)}
function msg(t){const e=$$h('hlMsg');if(e)e.innerHTML=t}
function tweenMult(to){const e=$$h('hlMult');if(!e)return;cancelAnimationFrame(H.multRAF);const from=H.shownMult,t0=performance.now();H.shownMult=to;const step=now=>{const u=Math.min(1,(now-t0)/450),k=1-Math.pow(1-u,3),v=from+(to-from)*k;e.textContent='×'+v.toFixed(2);if(u<1)H.multRAF=requestAnimationFrame(step)};H.multRAF=requestAnimationFrame(step);if(to>from)e.animate([{transform:'scale(1)'},{transform:'scale(1.22)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'})}
function refreshBtns(disabled){const u=$$h('hlUp'),d=$$h('hlDown'),s=$$h('hlSkip'),c=$$h('hlCash');if(!u)return;const ux=H.up,dx=H.down;u.disabled=disabled||!ux;d.disabled=disabled||!dx;$$h('hlUpX').textContent=ux?'×'+ux.toFixed(2)+' · '+Math.round(.96/ux*100)+'%':'невозможно';$$h('hlDownX').textContent=dx?'×'+dx.toFixed(2)+' · '+Math.round(.96/dx*100)+'%':'невозможно';s.disabled=disabled;c.disabled=disabled||H.steps<1;c.textContent=H.steps>=1?'💰 Забрать '+money(Math.round(H.bet*H.mult))+' TON':'💰 Забрать'}
function setInfo(){const w=$$h('hlWin');if(w)w.textContent=H.active?'Выигрыш '+money(Math.round(H.bet*H.mult))+' TON':'Сделай ставку'}
function sparks(n,color,x,y){const st=stage();if(!st)return;const r=st.getBoundingClientRect();for(let i=0;i<n;i++){const s=document.createElement('i');s.className='hl-spark';s.style.background=color;s.style.left=(x-r.left)+'px';s.style.top=(y-r.top)+'px';s.style.boxShadow='0 0 10px '+color;st.appendChild(s);const a=Math.random()*6.283,d=50+Math.random()*90;s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+30}px) scale(.2)`,opacity:0}],{duration:700+Math.random()*400,easing:'cubic-bezier(.2,.7,.3,1)'}).finished.then(()=>s.remove(),()=>s.remove())}}
function flash(color){const f=$$h('hlFlash');if(!f)return;f.style.setProperty('--fl',color);f.animate([{opacity:.5},{opacity:0}],{duration:600,easing:'ease-out'})}
function shake(){const s=stage();if(!s)return;s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}
function glow(el,cls){if(!el)return;el.classList.remove('glow-ok','glow-bad','glow-gold');el.classList.add(cls)}
function sfx(kind){const f=FX();if(!f.st.sound)return;if(kind==='flip'){f.tone(520,0,.06,'triangle',.04,300)}else if(kind==='ok'){f.tone(660,0,.1,'sine',.06);f.tone(880,.09,.16,'sine',.06)}else if(kind==='bad'){f.tone(240,0,.3,'sawtooth',.05,80)}else if(kind==='cash'){[784,988,1175,1568].forEach((x,i)=>f.tone(x,i*.07,.2,'sine',.06))}}

/* ---------- карты ---------- */
function toTrail(old,res,card){const tr=$$h('hlTrail');if(!tr||!old)return Promise.resolve();const tc=center(tr),oc=center(old);const mini=document.createElement('div');mini.className='hl-mini'+(res==='skip'?' skip':'');if(card){mini.style.color=RED[card.suit]?'#d6283f':'#1b2133';mini.innerHTML=`${RK(card.rank)}<span>${card.suit}</span>`}
 const a=old.animate([{transform:'translate(0,0) scale(1) rotate(0)',opacity:1},{transform:`translate(${tc.x-oc.x}px,${tc.y-oc.y}px) scale(.3) rotate(-8deg)`,opacity:.15}],{duration:430,easing:'cubic-bezier(.5,0,.8,.4)',fill:'forwards'});
 return fin(a).then(()=>{old.remove();tr.appendChild(mini);while(tr.children.length>7)tr.firstChild.remove()})}
async function deal(card,prevRes,prevCard,faceUpInstant){
 const st=stage();if(!st)return null;const old=H.el;H.el=null;
 if(old){if(H.idleCard){old.animate([{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.7)'}],{duration:260,fill:'forwards'}).finished.then(()=>old.remove(),()=>old.remove());H.idleCard=false}else toTrail(old,prevRes,prevCard)}
 const el=mk(card,false);st.appendChild(el);H.el=el;
 if(faceUpInstant){el.firstChild.style.transform='rotateY(180deg)';return el}
 const dk=$$h('hlDeck'),dc=center(dk),cc=center(el);sfx('flip');
 await fin(el.animate([{transform:`translate(${dc.x-cc.x}px,${dc.y-cc.y}px) scale(.5) rotate(-14deg)`,opacity:.9},{transform:'translate(0,0) scale(1) rotate(0)',opacity:1}],{duration:440,easing:'cubic-bezier(.2,.8,.2,1)'}));
 sfx('flip');el.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(-16px) scale(1.09)',offset:.5},{transform:'translateY(0) scale(1)'}],{duration:560,easing:'ease-in-out'});
 await fin(el.firstChild.animate([{transform:'rotateY(0deg)'},{transform:'rotateY(180deg)'}],{duration:560,easing:'cubic-bezier(.45,.05,.2,1)',fill:'forwards'}));
 el.firstChild.style.transform='rotateY(180deg)';return el}
function showIdleCard(){const st=stage();if(!st)return;if(H.el)return;const el=mk(null,false);el.classList.add('float');st.appendChild(el);H.el=el;H.idleCard=true}
function apply(r){H.card=r.card;H.mult=Number(r.mult)||1;H.steps=r.steps||0;H.up=r.up||null;H.down=r.down||null;if(r.bet)H.bet=r.bet}

/* ---------- действия ---------- */
window.hiloStart=async function(){if(H.busy)return;const bet=getBet();if(!bet)return;H.busy=true;const b=$$h('hlStart');if(b)b.disabled=true;
 try{const r=await api(API.hilo,{action:'start',bet});if(!$$h('hiloStage'))return;
  H.active=true;H.shownMult=1;apply(r);if(r.balance!=null){S.balance=r.balance;renderState()}refreshState(false);
  const tr=$$h('hlTrail');if(tr)tr.innerHTML='';const oldEnd=H.el;if(oldEnd&&!H.idleCard){H.idleCard=true}
  setMode(true);tweenMult(1);setInfo();refreshBtns(true);msg('Карта сдана — выбирай!');
  const el=await deal(r.card,null,null);if(el)glow(el,'glow-gold');refreshBtns(false)}
 catch(e){const m=errText(e);if(/уже идёт игра/.test(m))await hiloSync();else toast('⚠️ '+(/http_404|http_405|некорректн|unknown/.test(m)?'Выше-Ниже ещё не включено на сервере — обнови бота':m),'bad')}
 finally{H.busy=false;if(b)b.disabled=false}};

window.hiloGuess=async function(dir){if(H.busy||!H.active)return;H.busy=true;refreshBtns(true);msg(dir==='up'?'▲ Будет выше…':'▼ Будет ниже…');
 try{const r=await api(API.hilo,{action:'guess',dir,bet:H.bet});const prev=H.card;
  const el=await deal(r.card,'ok',prev);const c=center(el);
  if(r.correct===false){H.active=false;glow(el,'glow-bad');flash('#ff3b4a');shake();sfx('bad');FX().hap('n','error');sparks(18,'#ff5d6c',c.x,c.y);setMode(false);msg(`💥 Не угадал · <span style="color:#ff8d98">−${money(r.bet)} TON</span>`);tweenMult(1);const w=$$h('hlWin');if(w)w.textContent='Раунд окончен';if(r.balance!=null){S.balance=r.balance;renderState()}refreshState(false);H.card=r.card}
  else{apply(r);glow(el,'glow-ok');flash('#2ecc71');sfx('ok');FX().hap('i','medium');sparks(16,'#7dffb0',c.x,c.y);tweenMult(H.mult);setInfo();
   if(r.cashed){H.active=false;glow(el,'glow-gold');sfx('cash');sparks(36,'#ffd47c',c.x,c.y);setMode(false);msg(`🏆 Максимум! Забрано <b>×${H.mult.toFixed(2)}</b> · <span style="color:#7dffb0">+${money(r.win_amount)} TON</span>`);if(r.balance!=null){S.balance=r.balance;renderState()}refreshState(false)}
   else{msg(`✅ Верно! Серия: <b>${H.steps}</b>`);refreshBtns(false)}}}
 catch(e){toast('⚠️ '+errText(e),'bad');refreshBtns(false);msg('Попробуй ещё раз')}
 finally{H.busy=false}};

window.hiloSkip=async function(){if(H.busy||!H.active)return;H.busy=true;refreshBtns(true);
 try{const r=await api(API.hilo,{action:'skip'});const prev=H.card;const el=await deal(r.card,'skip',prev);apply(r);glow(el,'glow-gold');msg('Карта заменена — множитель сохранён');refreshBtns(false)}
 catch(e){toast('⚠️ '+errText(e),'bad');refreshBtns(false)}
 finally{H.busy=false}};

window.hiloCash=async function(){if(H.busy||!H.active||H.steps<1)return;H.busy=true;refreshBtns(true);
 try{const r=await api(API.hilo,{action:'cashout',bet:H.bet});H.active=false;const el=H.el;if(el)glow(el,'glow-gold');const c=el?center(el):{x:0,y:0};sfx('cash');FX().hap('n','success');flash('#ffc45c');sparks(34,'#ffd47c',c.x,c.y);setMode(false);msg(`💰 Забрано <b>×${Number(r.mult).toFixed(2)}</b> · <span style="color:#7dffb0">+${money(r.win_amount)} TON</span>`);const w=$$h('hlWin');if(w)w.textContent='Раунд окончен';if(r.balance!=null){S.balance=r.balance;renderState()}refreshState(false)}
 catch(e){toast('⚠️ '+errText(e),'bad');refreshBtns(false)}
 finally{H.busy=false}};

async function hiloSync(){try{const r=await api(API.hilo,{action:'state'});if(!$$h('hiloStage'))return;
 if(r.active){H.active=true;apply(r);H.shownMult=H.mult;const be=$$h('bet');if(be)be.value=r.bet;if(H.el){H.el.remove();H.el=null;H.idleCard=false}const tr=$$h('hlTrail');if(tr){tr.innerHTML='';(r.trail||[]).forEach(c=>{const m=document.createElement('div');m.className='hl-mini';m.style.color=RED[c.suit]?'#d6283f':'#1b2133';m.innerHTML=`${RK(c.rank)}<span>${c.suit}</span>`;tr.appendChild(m)})}
  await deal(r.card,null,null,true);setMode(true);tweenMult(H.mult);setInfo();refreshBtns(false);msg('▶️ Раунд продолжается — твой ход');toast('▶️ Продолжаем твою игру в «Выше-Ниже»')}
 }catch(e){}}

window.hiloInit=function(){H.active=false;H.busy=false;H.el=null;H.idleCard=false;H.shownMult=1;H.steps=0;H.mult=1;setMode(false);showIdleCard();hiloSync()};
window.hiloStop=function(){cancelAnimationFrame(H.multRAF)};
})();
</script>
<style id="dicegl-css">
.dice-stage canvas#diceGL{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}
